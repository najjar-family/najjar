<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="نسب آل النجّار — الأنصاريّون الخزرجيّون، من آدم عليه السلام إلى اليوم."><title>نسب آل النجّار — للاطّلاع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* ── آل النجّار · نظام النسب ───────────────────────────────────────────
   لوح ورقي دافئ، ذهبٌ للرجال ووردٌ للنساء ورمادٌ للحلقة المفقودة.
   كل شيء يلتفّ داخل عرض الشاشة — لا تمرير أفقي في أي حال.           */
:root{
  --paper:#F7F1E3; --card:#FFFCF3; --card2:#FBF5E6; --ink:#241C12; --ink2:#53442F;
  --muted:#8A7A60; --line:#DCCDAA; --line2:#EADDC2;
  --gold:#B4893A; --gold2:#8A6519; --goldbg:#F6EBD2;
  --rose:#B9587A; --rosebg:#FBEAF0;
  --green:#4E7A42; --greenbg:#E9F1E4;
  --grey:#9A9078; --greybg:#E8E2D4;
  --red:#A6422F;
  --d:"Amiri","Traditional Arabic",serif;
  --u:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --sc:1;                       /* معامل التكبير في الشجرة */
  --r:12px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;direction:rtl;background:var(--paper);color:var(--ink);font-family:var(--u);
  font-size:15px;line-height:1.65;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--d);line-height:1.25;margin:0}
a{color:var(--gold2)}

/* ── شريط علوي ───────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 94%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1060px;margin:0 auto;padding:9px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--d);font-weight:700;font-size:clamp(19px,4.6vw,25px);white-space:nowrap}
.brand span{display:block;font-family:var(--u);font-size:11px;font-weight:400;color:var(--muted);margin-top:-2px}
.who{margin-inline-start:auto;display:flex;gap:7px;align-items:center;font-size:12px;color:var(--ink2);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;max-width:100%}
.who img{width:24px;height:24px;border-radius:50%;flex:none}
.who b{font-weight:600}
.tag{font-size:10.5px;border-radius:999px;padding:1px 7px;border:1px solid currentColor;white-space:nowrap}
.tag.ow{color:var(--gold2)} .tag.ed{color:var(--green)} .tag.vw{color:var(--muted)}
nav.tabs{max-width:1060px;margin:0 auto;padding:0 8px 8px;display:flex;gap:5px;overflow-x:auto;
  scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;
  font-size:13.5px;cursor:pointer;white-space:nowrap;flex:none}
.tab:hover{border-color:var(--gold)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#FBF5E6;font-weight:600}

/* ── تخطيط ───────────────────────────────────────────── */
main{max-width:1060px;margin:0 auto;padding:16px 14px 90px}
section[hidden]{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 18px;margin-bottom:14px}
.panel>h2{font-size:23px;margin-bottom:4px}
.panel>h3{font-size:19px;margin:18px 0 6px}
.lede{color:var(--ink2);margin:2px 0 12px}
.hr{height:1px;background:var(--line2);margin:16px 0}
.muted{color:var(--muted)}
.sm{font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 180px;min-width:0}

/* ── أزرار ───────────────────────────────────────────── */
.b{border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:8px 14px;
  font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center;
  white-space:nowrap;transition:.12s}
.b:hover{border-color:var(--gold);background:var(--goldbg)}
.b:disabled{opacity:.45;cursor:not-allowed}
.b.pri{background:var(--ink);border-color:var(--ink);color:#FBF5E6}
.b.pri:hover{background:#3A2E1E}
.b.add{background:var(--greenbg);border-color:#BCCFB4;color:#33562A}
.b.add:hover{background:#DDEAD6}
.b.edit{background:var(--goldbg);border-color:#E0CCA0;color:var(--gold2)}
.b.del{background:#FAE8E3;border-color:#E6C2B8;color:var(--red)}
.b.sm{padding:5px 10px;font-size:12.5px}
.b.ic{padding:6px 9px}
.b.on{background:var(--rose);border-color:var(--rose);color:#fff}

/* ── نماذج ───────────────────────────────────────────── */
.fld{display:block;margin-bottom:11px}
.fld>span{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.fld>span i{font-style:normal;color:var(--red)}
.fld>span em{font-style:normal;font-weight:400;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px}
textarea{min-height:68px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--goldbg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FBF5E6;font-weight:600}
.chip.f[aria-pressed="true"]{background:var(--rose);border-color:var(--rose)}
.chip.al[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.hintline{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:10px}

/* ── العُنوان المُذهَّب فوق الشجرة ───────────────────────── */
.unwan{margin:-6px -4px 12px}
.unwan svg{width:100%;height:auto;display:block}
.unwan .fr{font-family:var(--d)}

/* ── الشجرة ───────────────────────────────────────────── */
.treebar{position:sticky;top:0;z-index:5;display:flex;gap:7px;flex-wrap:wrap;align-items:center;
  padding:9px 0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(6px)}
.crumbs{display:flex;gap:3px;flex-wrap:wrap;align-items:center;font-family:var(--d);font-size:15px;
  padding:7px 0 10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.crumbs button{border:0;background:none;cursor:pointer;padding:2px 5px;border-radius:6px;font-family:var(--d);font-size:15px}
.crumbs button:hover{background:var(--goldbg)}
.crumbs i{font-style:normal;color:var(--muted);font-size:11px}

.node{margin:0}
.kidwrap{margin-inline-start:calc(10px * var(--sc));padding-inline-start:calc(10px * var(--sc));
  border-inline-start:2px dashed var(--line);margin-top:6px}
.kids{display:flex;flex-wrap:wrap;gap:calc(7px * var(--sc));margin:2px 0 8px}
.pcard{position:relative;display:flex;gap:calc(7px * var(--sc));align-items:center;
  background:var(--card2);border:1.5px solid var(--line);border-radius:calc(11px * var(--sc));
  padding:calc(6px * var(--sc)) calc(11px * var(--sc));cursor:pointer;
  font-family:var(--d);font-size:calc(17px * var(--sc));line-height:1.3;
  max-width:100%;transition:.12s}
.pcard:hover{border-color:var(--gold);background:var(--goldbg)}
.pcard[data-sel="1"]{border-color:var(--ink);background:#fff;box-shadow:0 2px 10px rgba(60,40,10,.14)}
.pcard.f{border-color:#E7BECD;background:var(--rosebg)}
.pcard.f:hover{border-color:var(--rose)}
.pcard.gap{border-style:dashed;border-color:var(--grey);background:var(--greybg);color:var(--muted)}
.pcard .av{width:calc(27px * var(--sc));height:calc(27px * var(--sc));border-radius:50%;object-fit:cover;
  background:var(--goldbg);border:1px solid var(--line);flex:none}
.pcard .nm{font-weight:700}
.pcard .cnt{font-family:var(--u);font-size:calc(10.5px * var(--sc));background:var(--green);color:#fff;
  border-radius:999px;padding:0 calc(6px * var(--sc));font-weight:600;flex:none}
.pcard.f .cnt{background:var(--rose)}
.pcard .dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.alive{background:var(--green)} .dot.dead{background:var(--grey)} .dot.unk{background:#D9C58E}
.pcard .car{font-family:var(--u);font-size:calc(11px * var(--sc));color:var(--muted);flex:none}

.chainbox{border:1px solid var(--line2);border-radius:10px;background:var(--card2);padding:10px 12px;margin-bottom:12px}
.chainlist{display:flex;flex-wrap:wrap;gap:5px;font-family:var(--d);font-size:15.5px;margin-top:8px}
.chainlist span{background:#fff;border:1px solid var(--line2);border-radius:999px;padding:3px 10px}
.chainlist span.gapl{border-style:dashed;border-color:var(--grey);background:var(--greybg);color:var(--muted)}
.chainlist span b{font-family:var(--u);font-size:10px;color:var(--muted);font-weight:500;margin-inline-end:4px}

/* ── اللوحة الجانبية (بطاقة الشخص) ───────────────────── */
.sheet{position:fixed;inset:auto 0 0 0;z-index:60;background:var(--card);border-top:2px solid var(--gold);
  border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(50,35,10,.26);max-height:88vh;overflow:auto;
  padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:none}
.sheet.show{display:block}
@media(min-width:760px){.sheet{inset:0 auto 0 0;width:430px;max-width:92vw;border-radius:0 16px 16px 0;
  border:0;border-inline-end:2px solid var(--gold);max-height:100vh;box-shadow:10px 0 40px rgba(50,35,10,.2)}}
.sheet .x{position:absolute;inset-inline-start:12px;top:10px;border:0;background:none;font-size:20px;
  color:var(--muted);cursor:pointer}
.sheet h2{font-size:26px;padding-inline-end:28px}
.nasab{font-family:var(--d);font-size:15px;color:var(--ink2);line-height:1.9;margin:6px 0 10px;
  background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:8px 11px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:8px 0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:500}
.photo{width:100%;max-height:260px;object-fit:contain;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);margin-bottom:8px}

/* ── جداول وقوائم ───────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line2);padding:6px 8px;text-align:start;vertical-align:top}
th{background:var(--card2);font-weight:600}
.tw{overflow-x:auto;border-radius:9px}
.item{display:flex;gap:10px;align-items:center;border:1px solid var(--line2);border-radius:10px;
  padding:9px 11px;margin-bottom:7px;background:var(--card2);flex-wrap:wrap}
.item .gw{flex:1 1 160px;min-width:0}
.item b{font-weight:600}

/* ── ملاحظات ───────────────────────────────────────── */
.note{border-inline-start:4px solid var(--gold);background:var(--goldbg);border-radius:0 9px 9px 0;
  padding:9px 12px;margin:10px 0;font-size:13.5px}
.note.warn{border-color:var(--red);background:#FAEDE8}
.note.ok{border-color:var(--green);background:var(--greenbg)}
.toast{position:fixed;inset-inline:0;bottom:18px;z-index:90;display:flex;justify-content:center;pointer-events:none}
.toast div{background:var(--ink);color:#FBF5E6;border-radius:999px;padding:9px 18px;font-size:13.5px;
  box-shadow:0 8px 28px rgba(0,0,0,.3)}

/* نصّ التوثيق المحفوظ */
#refsbody h2{font-size:23px;margin-bottom:4px}
#refsbody h3{font-size:18px;margin:20px 0 6px;color:var(--gold2)}
#refsbody .chain{font-family:var(--d);font-size:16.5px;background:var(--card2);border:1px solid var(--line2);
  border-radius:10px;padding:10px 12px;margin:8px 0;line-height:1.95}
#refsbody .src{font-size:12.5px;color:var(--muted)}
#refsbody .was{color:var(--red)} #refsbody .now{color:var(--green);font-weight:600}
#refsbody table{font-size:12.5px}
#refsbody ol{padding-inline-start:20px}
#refsbody li{margin-bottom:6px}
#refsbody .tablewrap{overflow-x:auto;border-radius:9px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>@media print{.top,.treebar,.chainbox,.sheet,.toast{display:none!important}body{background:#fff}.panel{border:0;padding:0;background:#fff}.kidwrap{break-inside:avoid}}</style>
</head><body><header class="top">
  <div class="topin">
    <div class="brand">آل النجّار<span>نسبُ البيت · الأنصار الخزرج</span></div>

</header>

<main>
  <section id="v-home">
    <div class="panel">
      <h2 id="homeTitle">آلُ النجّار</h2>
      <p class="lede" id="homeSub"></p>
      <div id="homeBody"></div>
      <div class="hr"></div>
      <div class="row" id="homeStats"></div>
      <div class="hr"></div>
      <h3>القائم على هذه الصفحة</h3>
      <div id="homeKeeper"></div>
      <button class="b edit" id="editHome" hidden></button>
    </div>
  </section>

  <section id="v-tree" hidden>
    <div class="panel">
      <div class="unwan" id="unwan"></div>

        <button class="b" id="tGirls">إظهار البنات</button>
        <button class="b ic" id="tZoomOut" aria-label="تصغير">−</button>
        <button class="b ic" id="tZoomIn" aria-label="تكبير">+</button>
        <button class="b" id="tAll">فتح الكل</button>
        <button class="b" id="tNone">طيّ الكل</button>

<div class="sheet" id="sheet"><button class="x" id="sheetX" aria-label="إغلاق">✕</button><div id="sheetBody"></div></div>
<div class="toast" id="toast" hidden><div></div></div>
<script>
const REFS = `
<h2>توثيق سلسلة النسب</h2>
<p class="lede">تبيّن هذه الصفحة ثلاثة أمور: ما صُحّح في السلسلة ومصدر كل تصحيح، وما بقي على خلافٍ بين النسّابين، وما لا مصدر منشور له أصلاً. حُرّرت في ٤ أكتوبر ٢٠٢٦ م.</p>
<div class="note">السلسلة الأصلية وصلت كما هي من العائلة، ولم يُحذف منها اسم إلا وسببه مذكور أدناه نصّاً. والتصحيح كان بمقابلة الأسماء على المصادر المذكورة في آخر الصفحة، وكلها متاحة على الشبكة بروابطها لمن أراد المراجعة بنفسه.</div>

<h3>٠ · الأصل الذي قوبلت عليه هذه الشجرة</h3>
<p>الأصل شجرة العائلة المرسومة باليد على هيئة نخلة: جِذعها سلسلة النسب من آدم عليه السلام صعوداً إلى <b>عطا الله</b>، ثم تتفرّع منه الأغصان والأوراق في الأجيال المتأخرة. ومكتوب في صدرها قوله تعالى في الأنصار: ﴿والذين تبوّؤوا الدار والإيمان من قبلهم… ويؤثرون على أنفسهم﴾، وفي حاشيتها إحالة إلى <b>صحيح البخاري — نسب الأنصار، رقم ٢٥٧٨</b>.</p>
<div class="note"><b>نتيجة المقابلة:</b> قوبلت أسماء الجذع في هذه الصفحة على صور الشجرة الأصلية اسماً اسماً، فطابقت ما نُقل عنها مطابقة تامة. ومعنى ذلك أن المواضع المصحّحة أدناه — «وقيل» و«قيل» و«بنو الخزرج» و«يغوث» و«لقيا» وتبادل حارثة وثعلبة — ليست خطأ في النقل عن الشجرة، بل هي في <b>الشجرة الأصلية نفسها</b>. فالتصحيح هنا تصحيح لها، لا على ناقلها.</div>

<h3>١ · من آدم إلى نوح عليهما السلام</h3>
<p>خمسة أسماء كانت محرّفة، واثنان منها كان ترتيبهما مقلوباً: الصواب مهلائيل ثم يرد.</p>
<div class="tablewrap"><table><tr><th>كان في القائمة</th><th>الصواب</th><th>الملاحظة</th></tr>
<tr><td class="was">شعيب عليه السلام</td><td class="now">شيث</td><td>شعيب عليه السلام نبيٌّ متأخر في مَدْيَن، وليس ابن آدم</td></tr>
<tr><td class="was">قنيان</td><td class="now">قينان</td><td>تحريف في الضبط</td></tr>
<tr><td class="was">يزد</td><td class="now">مهلائيل</td><td>الاسم والموضع</td></tr>
<tr><td class="was">صلدئيل</td><td class="now">يرد</td><td>الاسم والموضع</td></tr>
<tr><td class="was">متشولم</td><td class="now">متوشلخ</td><td>تحريف في الضبط</td></tr></table></div>
<p>فصارت السلسلة كما ترد بلفظها في المصادر:</p>
<div class="chain">نوح بن لامَك بن متوشلخ بن أخنوخ — وهو إدريس — بن يرد بن مهلائيل بن قينان بن أنوش بن شيث بن آدم</div>
<p class="src">المرجعان ٢ و٣.</p>

<h3>٢ · من نوح إلى إبراهيم عليهما السلام</h3>
<p>كان في هذا القسم خمسة أجيال ساقطة، وسببها واضح: كلمة <b>«وقيل»</b> التي كانت في موضع اسم ليست اسماً، بل هي أول عبارة «وقيل…» في نصٍّ يذكر رأياً آخر في النسب؛ فالتقطها الناسخ على أنها اسم رجل، وطُوي معها ما بعدها. ووقعت الآفة نفسها مرة ثانية في القسم الثالث.</p>
<div class="tablewrap"><table><tr><th>كان في القائمة</th><th>الصواب</th><th>الملاحظة</th></tr>
<tr><td class="was">فخشيد</td><td class="now">أرفخشذ</td><td>تحريف في الضبط</td></tr>
<tr><td class="was">عابد</td><td class="now">عابر</td><td>تحريف في الضبط</td></tr>
<tr><td class="was">وقيل</td><td class="now">فالغ</td><td>«وقيل» ليست اسماً</td></tr>

<h3>٥ · من الأزد إلى النجار وأبي أيوب الأنصاري</h3>

<h3>٦ · بنو النجار في السنّة، وصلتهم بالنبي ﷺ</h3>
<p>هذه العائلة من <b>بني النجار</b>، وهم بطنٌ من الخزرج من الأنصار، كما تبيّن في القسم الخامس. ولهم في السنّة ذكران ثابتان:</p>

<p><b>الأول — تقديمهم على دور الأنصار.</b> قال النبي ﷺ:</p>
<div class="chain">«خَيْرُ دُورِ الأنصارِ بَنُو النَّجَّارِ، ثُمَّ بَنُو عَبْدِ الأشْهَلِ، ثُمَّ بَنُو الحارِثِ بنِ الخَزْرَجِ، ثُمَّ بَنُو ساعِدَةَ، وفي كُلِّ دُورِ الأنصارِ خَيْرٌ»</div>
<p>رواه أبو أُسَيْد الساعدي رضي الله عنه. أخرجه البخاري في مناقب الأنصار، باب فضل دور الأنصار، برقم ٣٥٧٨–٣٥٨٠، وأخرجه مسلم في فضائل الصحابة، باب في خير دور الأنصار. ولمّا سمعه سعد بن عبادة قال: «يا رسول الله، خير دور الأنصار فجُعلنا آخراً»، فقال ﷺ: «أوَليس بحسبكم أن تكونوا من الخيار».</p>
<p class="src">المرجع ٨. وفي حاشية الشجرة الأصلية إحالة إلى «صحيح البخاري — نسب الأنصار رقم ٢٥٧٨»، ويغلب على الظن أنها تعني هذا الحديث وأن رقمه سقطت منه خانة، والصواب ٣٥٧٨؛ ولم أقطع بذلك.</p>

<p><b>الثاني — أنهم أخوال النبي ﷺ.</b> تزوّج هاشم بن عبد مناف <b>سلمى بنت عمرو</b> النجارية، من بني عدي بن النجار بيثرب، فولدت له <b>عبد المطلب</b> جدَّ النبي ﷺ. فصار بنو النجار أخوال عبد المطلب، ومن ثَمّ أخوال عبد الله أبي النبي ﷺ، ولذلك كان ﷺ يسمّيهم أخواله. وتوفي عبد الله رضي الله عنه بالمدينة عند أخواله بني عدي بن النجار. ولمّا هاجر النبي ﷺ نزل في بني النجار، في بيت <b>أبي أيوب الأنصاري</b> رضي الله عنه — وهو جدٌّ في هذه الشجرة.</p>
<p class="src">المرجع ٩.</p>

<div class="note warn"><b>تفريق لا يصح إغفاله:</b> بنو النجار <b>أخوال</b> النبي ﷺ من جهة جدّه عبد المطلب، وليسوا من ذريّته. فليس في هذه الشجرة — ولا في الشجرة الأصلية — انتسابٌ إلى النبي ﷺ نسبَ ولادة، وإنما هي صلة خؤولة ومصاهرة ونصرة وجوار، وهي في نفسها شرف عظيم يُستغنى به عن الزيادة. وما جاوز هذا الحدّ من دعوى الانحدار منه ﷺ فلا أصل له، وذكره على وجهه أنفع للعائلة وأبقى.</div>

<h3>٧ · ما لا مصدر منشور له</h3>
<div class="note warn">الأسماء من <b>أبي منصور</b> نزولاً إلى <b>عطا الله</b> — وهي ثلاثة وثلاثون اسماً تلي أبا أيوب الأنصاري — لم أجد لها مصدراً منشوراً أقابلها عليه، فهي نسب العائلة الخاص. وقد أُثبتت كما وردت في قائمة العائلة حرفاً بحرف، ولم يُصحّح فيها شيء ولم يُحذف منها شيء. ومرجعها الوحيد هو شجرة العائلة المحفوظة وما عند كبار العائلة من توثيق، فهي موضع المراجعة والتصديق منهم.</div>
<p>وهذه الأسماء موجودة في جذع الشجرة الأصلية وطابقت المنقول عنها، لكن الشجرة نفسها لم تذكر لها سنداً، فهي محفوظة بالتواتر في العائلة.</p>
<p>وأما ما فوق <b>عطا الله</b> فالشجرة الأصلية تتفرّع فيه إلى عشرات الأوراق من أبنائه وأحفاده، ولم يُدخَل منها هنا إلا ما تأكّد؛ وما لم يتبيّن اتصاله أُثبت على هيئة <b>«حلقة مفقودة»</b> — عقدة رمادية بإطار متقطع — ولم يُفترض اتصال لم يُتحقّق منه.</p>

<h3>تحرّزات علمية لا بد من ذكرها</h3>
<ol>
<li><b>ما فوق عدنان موضع تحرّز عند أهل العلم.</b> يُروى أن النبي ﷺ كان إذا بلغ عدنان في النسب أمسك وقال: «كذب النسّابون»، ونهى الإمام مالك وغيره عن تجاوزه. فما كان في هذه الشجرة فوق ذلك فهو من قبيل المنقول في كتب التاريخ لا المقطوع به.</li>
<li><b>أسماء ما بين آدم وإبراهيم عليهما السلام مصدرها إسرائيلي.</b> نقلها المؤرخون المسلمون كالطبري وابن الأثير وابن كثير عن أهل الكتاب، وذكروها على وجه الحكاية لا التصحيح، ولذلك يتفاوت ضبطها من كتاب لكتاب: مهلائيل ومهلاييل، وأرغو ورعو، وتارح وتارخ.</li>
<li><b>طول السلسلة نفسه مظنّة الاختصار.</b> سبعة وثمانون جيلاً من آدم إلى اليوم عددٌ أقل بكثير مما تقتضيه المدة، وهذا معروف في سلاسل النسب الطويلة: تُحفظ أسماء المشاهير وتُطوى الأجيال بينها. فالمقصود من مثل هذه الشجرة سلسلة الأعلام المعروفة، لا إحصاء كل جيل.</li>
</ol>

const nameOf = p => p ? (p.gap ? "حلقة مفقودة" : (p.name || "بلا اسم")) : "";
const isF  = p => p && p.gender === "f";
const visP = p => p && (S.girls || !isF(p) || p.gap);
function kidsOf(id){
  const k = Object.values(S.P).filter(p => p.parentId === id);
  k.sort((a,b) => (a.order ?? 0) - (b.order ?? 0) || String(a.id).localeCompare(String(b.id)));
  return k;
}
const kidsVis = id => kidsOf(id).filter(visP);
function lineOf(id){ const o=[]; let c=S.P[id], g=0; while(c && g++<400){ o.push(c); c = c.parentId ? S.P[c.parentId] : null; } return o; }
function descN(id){ let n=0; kidsOf(id).forEach(k => { n += 1 + descN(k.id); }); return n; }
function nasabShort(id, n){
  const p = S.P[id]; if(!p) return "";
  const out = [nameOf(p)]; let c = p, first = true, g = 0, used = 0;
  while(c.parentId && g++ < 400){
    const pr = S.P[c.parentId]; if(!pr) break;
    if(used >= n){ const rest = lineOf(c.id).length - 1;
      out.push("… وإلى آدم عليه السلام (" + ar(rest) + " جَدّاً)"); break; }
    if(pr.gap) out.push("⋯"); else { out.push(first && isF(c) ? "بنت" : "بن", nameOf(pr)); used++; }
    first = false; c = pr;
  }
  return out.join(" ");
}
function nasab(id){
  const p = S.P[id]; if(!p) return "";
  const out = [nameOf(p)]; let c = p, first = true, g = 0;
  while(c.parentId && g++ < 400){
    const pr = S.P[c.parentId]; if(!pr) break;
    if(pr.gap) out.push("⋯"); else out.push(first && isF(c) ? "بنت" : "بن", nameOf(pr));
    first = false; c = pr;
  }
  return out.join(" ");
}
function rootId(){ const r = Object.values(S.P).find(p => !p.parentId); return r ? r.id : null; }
function trunk(){
  const o = []; let c = rootId(), g = 0;
  while(c && g++ < 400){ o.push(S.P[c]); const k = kidsOf(c); if(k.length !== 1) break; c = k[0].id; }
  return o;
}
const headId = () => { const t = trunk(); return t.length ? t[t.length-1].id : rootId(); };

/* ═══════════ عُنوانٌ مُذهَّب فوق الشجرة ═══════════
   على هيئة «عُنوان» المخطوطات: إطارٌ ذهبيّ مزخرف، ونخلةٌ في وسطه
   تذكيراً بالشجرة الأصلية المرسومة باليد على هيئة نخلة، وحولها
   أربعة أقراصٍ تحمل أرقام البيت وهي تتغيّر مع كل اسم يُضاف.      */
function frond(dx, dy){
  const x0 = 0, y0 = -50, x1 = dx * 0.48, y1 = -56 + dy * 0.30, x2 = dx, y2 = dy;
  let d = `<path d="M${x0} ${y0} Q ${x1.toFixed(1)} ${y1.toFixed(1)} ${x2} ${y2}" fill="none" stroke="url(#lfg)" stroke-width="3.6" stroke-linecap="round"/>`;
  for(let t = 0.30; t < 0.98; t += 0.135){
    const u = 1 - t;
    const px = u*u*x0 + 2*u*t*x1 + t*t*x2;
    const py = u*u*y0 + 2*u*t*y1 + t*t*y2;
    const s = dx >= 0 ? 1 : -1;
    d += `<path d="M${px.toFixed(1)} ${py.toFixed(1)} l ${(5.6*s).toFixed(1)} -4.6" stroke="#5E8A4E" stroke-width="1.7" stroke-linecap="round" opacity=".92"/>`;
    d += `<path d="M${px.toFixed(1)} ${py.toFixed(1)} l ${(4.4*s).toFixed(1)} 4.2" stroke="#44722F" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>`;
  }
  return d;
}
function palmArt(cx, cy, k){
  let g = `<g transform="translate(${cx} ${cy}) scale(${k})">`;
  g += `<ellipse cx="0" cy="2" rx="46" ry="6" fill="#3C2612" opacity=".12"/>`;
  g += `<path d="M-8 0 C -6.4 -19 -5 -36 -4 -50 L 4 -50 C 5 -36 6.4 -19 8 0 Z" fill="url(#brk)"/>`;
  for(let i = 0; i < 9; i++){ const y = -4 - i * 5.2, w = 7.6 - i * 0.38;
    g += `<path d="M${-w} ${y} q ${w} 2.2 ${2*w} 0" fill="none" stroke="#2E2012" stroke-width="1" opacity=".3"/>`; }
  [[-62,-18],[-50,-34],[-30,-46],[-11,-54],[11,-54],[30,-46],[50,-34],[62,-18]].forEach(f => { g += frond(f[0], f[1]); });
  [[-9,-44],[9,-44],[0,-38]].forEach(p =>
    { g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.1" fill="#B4893A" stroke="#8A6519" stroke-width=".7"/>`; });
  return g + `</g>`;
}
function medal(cx, cy, val, lab, r){
  r = r || 43;
  return `<g>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFFCF3" stroke="url(#gld)" stroke-width="2.6"/>
    <circle cx="${cx}" cy="${cy}" r="${(r*0.84).toFixed(1)}" fill="none" stroke="#B4893A" stroke-width="1" opacity=".55"/>
    <circle cx="${cx}" cy="${cy}" r="${(r*1.1).toFixed(1)}" fill="none" stroke="#B4893A" stroke-width=".9" opacity=".35" stroke-dasharray="2 5"/>
    <text class="fr" x="${cx}" y="${(cy+r*0.06).toFixed(1)}" text-anchor="middle" font-size="${(r*0.63).toFixed(1)}" font-weight="700" fill="#241C12">${ar(val)}</text>
    <text x="${cx}" y="${(cy+r*0.54).toFixed(1)}" text-anchor="middle" font-size="${(r*0.29).toFixed(1)}" fill="#8A7A60" font-family="IBM Plex Sans Arabic, sans-serif">${lab}</text>
  </g>`;
}
function knot(x, y, r){
  return `<g transform="translate(${x} ${y})" fill="none" stroke="url(#gld)" stroke-width="1.6">
    <circle r="${r}"/><circle r="${r*0.55}"/>
    <path d="M${-r} 0 L ${r} 0 M0 ${-r} L0 ${r}" opacity=".7"/>
    <path d="M${-r*0.7} ${-r*0.7} L ${r*0.7} ${r*0.7} M${-r*0.7} ${r*0.7} L ${r*0.7} ${-r*0.7}" opacity=".45"/></g>`;
}

  unwanW = innerWidth;
});

/* ═══════════ الصفحة الرئيسية ═══════════ */
const HOME_DEFAULT = `
<p>هذه العائلة من <b>بني النجّار</b>، بطنٍ من الخزرج من الأنصار، أهلِ المدينة الذين آووا النبيّ ﷺ ونصروه. ونسبها محفوظٌ في شجرةٍ قديمة مرسومة باليد على هيئة نخلة: جذعها سلسلةٌ من آدم عليه السلام صعوداً إلى <b>عطا الله</b>، ثم تتفرّع منه الأغصان في الأجيال المتأخرة. وقد نُقلت تلك الشجرة إلى هذا النظام اسماً اسماً، وقوبلت على مصادر النسب المعروفة، وأُثبت ما بقي مجهولاً على حاله <b>حلقةً مفقودة</b> لا تُملأ بالظنّ.</p>

<h3>خيرُ دور الأنصار</h3>
<p>قال النبيّ ﷺ:</p>
<div class="nasab">«خَيْرُ دُورِ الأنصارِ بَنُو النَّجَّارِ، ثُمَّ بَنُو عَبْدِ الأشْهَلِ، ثُمَّ بَنُو الحارِثِ بنِ الخَزْرَجِ، ثُمَّ بَنُو ساعِدَةَ، وفي كُلِّ دُورِ الأنصارِ خَيْرٌ»</div>
<p class="sm muted">رواه أبو أُسَيْد الساعدي رضي الله عنه. أخرجه البخاري في مناقب الأنصار، باب فضل دور الأنصار (٣٥٧٨–٣٥٨٠)، ومسلم في فضائل الصحابة. ولمّا سمعه سعد بن عبادة قال: «يا رسول الله، خير دور الأنصار فجُعلنا آخراً»، فقال ﷺ: «أوَليس بحسبكم أن تكونوا من الخيار».</p>

<h3>وقال الله فيهم</h3>
<div class="nasab">﴿وَالَّذِينَ تَبَوَّؤُوا الدَّارَ وَالإِيمَانَ مِن قَبْلِهِمْ يُحِبُّونَ مَنْ هَاجَرَ إِلَيْهِمْ وَلَا يَجِدُونَ فِي صُدُورِهِمْ حَاجَةً مِّمَّا أُوتُوا وَيُؤْثِرُونَ عَلَىٰ أَنفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌ﴾</div>
<p class="sm muted">سورة الحشر · ٩ — وهذه الآية مكتوبة في صدر شجرة العائلة الأصلية.</p>

<h3>قصّةٌ مختصرة</h3>
<p>تزوّج هاشم بن عبد مناف <b>سلمى بنت عمرو</b> النجاريّة من بني عديّ بن النجّار بيثرب، فولدت له <b>عبد المطّلب</b> جدَّ النبيّ ﷺ. فصار بنو النجّار أخوالَ عبد المطّلب ثم أخوالَ عبد الله أبي النبيّ ﷺ، ولذلك كان ﷺ يسمّيهم أخواله، وتوفّي أبوه عبد الله بالمدينة عندهم. فلمّا هاجر ﷺ بركت ناقته في بني النجّار، ونزل في بيت <b>أبي أيّوب الأنصاريّ</b> رضي الله عنه — وهو جدٌّ في هذه الشجرة — فأقام عنده سبعة أشهر حتى بُني المسجد والمساكن.</p>
<div class="note warn"><b>تفريقٌ لا يصحّ إغفاله:</b> بنو النجّار <b>أخوالُ</b> النبيّ ﷺ من جهة جدّه عبد المطّلب، وليسوا من ذرّيّته. فليس في هذه الشجرة انتسابٌ إليه ﷺ نسبَ ولادة، وإنما هي خؤولةٌ ومصاهرةٌ ونصرةٌ وجوار، وهي في نفسها شرفٌ عظيمٌ يُستغنى به عن الزيادة.</div>

<h3>ما الغرض من هذا النظام</h3>
<p>أن يبقى النسب محفوظاً مكتوباً لا في الذاكرة وحدها، وأن يستطيع كلُّ فرعٍ من العائلة أن يُدخل أبناءه وأحفاده بنفسه، وأن يُفرَّق في كل اسم بين ما ثبت بمصدر وما بقي موقوفاً على تصديق كبار العائلة.</p>`;

function drawHome(){
  const m = S.meta.home || {};
  $("#homeTitle").textContent = m.title || "آلُ النجّار";
  $("#homeSub").textContent   = m.sub   || "الأنصاريّون الخزرجيّون — بيتٌ من بني النجّار، أخوالِ النبيّ ﷺ وأهلِ داره يوم الهجرة";
  $("#homeBody").innerHTML    = m.body  || HOME_DEFAULT;

  const all = Object.values(S.P).filter(p => !p.gap);
  const men = all.filter(p => !isF(p)).length, women = all.filter(isF).length;
  const alive = all.filter(p => p.status === "alive").length;
  const gen = (() => { let mx = 0; Object.keys(S.P).forEach(id => { mx = Math.max(mx, lineOf(id).length); }); return mx; })();
  const st = [["الأسماء المسجّلة", all.length],["الرجال", men],["النساء", women],["الأحياء", alive],["الأجيال من آدم عليه السلام", gen]];
  $("#homeStats").innerHTML = st.map(([k,v]) =>
    `<div class="item" style="flex:1 1 140px;display:block"><div class="sm muted">${k}</div><div style="font-family:var(--d);font-size:26px;font-weight:700">${iso(v)}</div></div>`).join("");

  const k = S.meta.keeper || {};
  $("#homeKeeper").innerHTML =
    `<p>${esc(k.text || "القائم على هذه الصفحة اليوم: سلطان بن نبيل بن إبراهيم بن عبدالقادر بن محمد بن عبدالقادر النجّار. وهو الذي يملك وحده تعديل سلسلة النسب المحقّقة، ويمنح بقيّة أفراد العائلة صلاحية إدخال فروعهم.")}</p>
     <div class="note">إدارة هذه الصفحة <b>تُورَّث</b>: لمدير النظام أن يرفع أحد أفراد العائلة إلى «مسؤول» فيشاركه كل صلاحياته عدا تعديل الأصل المحقّق، وله أن يسلّم الصفحة كاملة لمن بعده. والمرجّح في الاختيار أعلمُهم بالنسب وأحرصُهم على ضبطه.</div>`;
  $("#editHome").hidden = !S.me.owner;
}

/* ═══════════ جذع النسب ═══════════ */
function drawChain(){
  const t = trunk(), box = $("#chainList");
  box.innerHTML = `<div class="sm muted" style="margin-top:8px">${iso(t.length)} اسماً متسلسلاً — ثم يتفرّع البيت</div>
    <div class="chainlist">` + t.map((p,i) =>
      `<span class="${p.gap?"gapl":""}" data-go="${esc(p.id)}"><b>${ar(i+1)}</b>${esc(nameOf(p))}</span>`).join("") + `</div>`;
}

/* ═══════════ الشجرة ═══════════ */
function card(p, sel){
  const kv = kidsVis(p.id).length, kall = kidsOf(p.id).length;
  const hid = kall - kv;
  const st = p.status === "alive" ? "alive" : (p.status === "dead" ? "dead" : "unk");
  const ph = p.photo ? `<img class="av" src="/_blob/${esc(p.photo)}" alt="">` : "";
  return `<button class="pcard ${isF(p)?"f":""} ${p.gap?"gap":""}" data-id="${esc(p.id)}" data-sel="${sel?1:0}">
     ${ph}<span class="dot ${st}"></span><span class="nm">${esc(nameOf(p))}</span>
     ${kv?`<span class="cnt">${ar(kv)}</span>`:""}
     ${hid?`<span class="car">+${ar(hid)}</span>`:""}
     <span class="car">${kv ? (S.open[p.id] ? "▴" : "▾") : ""}</span>
   </button>`;
}
function subtree(id, depth){
  const ks = kidsVis(id);
  if(!ks.length) return "";
  let h = `<div class="kids">` + ks.map(k => card(k, S.focus === k.id)).join("") + `</div>`;
  ks.forEach(k => {
    if(S.open[k.id] && kidsVis(k.id).length){
      h += `<div class="kidwrap"><div class="sm muted" style="margin-bottom:3px">أبناء ${esc(nameOf(k))}</div>`
         + subtree(k.id, depth+1) + `</div>`;
    }
  });
  return h;
}
function drawTree(){
  document.documentElement.style.setProperty("--sc", S.sc);
  $("#tGirls").textContent = S.girls ? "إخفاء البنات" : "إظهار البنات";
  $("#tGirls").classList.toggle("on", S.girls);
  drawUnwan();
  if(!Object.keys(S.P).length){ $("#treeBody").innerHTML = '<p class="muted">يجري تحميل الأسماء…</p>'; return; }
  const root = S.root || headId();
  drawChain();
  const path = lineOf(root).reverse();
  const shown = path.length > 6 ? [path[0], null].concat(path.slice(-5)) : path;
  $("#crumbs").innerHTML = shown.map((p,i) =>
      (i ? `<i>›</i>` : "") + (p === null ? `<i>⋯ ${ar(path.length-6)} جَدّاً ⋯</i>`
        : `<button data-root="${esc(p.id)}">${esc(nameOf(p))}</button>`)).join("")
    + (root !== headId() ? ` <button class="b sm" data-root="${esc(headId())}" style="margin-inline-start:auto">عودة إلى رأس البيت</button>` : "");
  const rp = S.P[root];
  const inner = subtree(root, 0);
  $("#treeBody").innerHTML =
    `<div class="kids">${card(rp, S.focus===root)}</div>` +
    (inner ? `<div class="kidwrap"><div class="sm muted" style="margin-bottom:3px">أبناء ${esc(nameOf(rp))}</div>${inner}</div>`
           : `<p class="muted sm" style="margin-top:10px">لا ذرّية مسجّلة تحت هذا الاسم بعد.</p>`);
}
function openAll(v){
  S.open = {};
  if(v) Object.keys(S.P).forEach(id => { if(kidsVis(id).length) S.open[id] = true; });
  redraw();
}
function revealTo(id){ let c = S.P[id]; while(c && c.parentId){ S.open[c.parentId] = true; c = S.P[c.parentId]; } }

$("#treeBody").addEventListener("click", e => {
  const b = e.target.closest(".pcard"); if(!b) return;
  const id = b.dataset.id;
  if(kidsVis(id).length) S.open[id] = !S.open[id];
  S.focus = id; openSheet(id); redraw();
});
$("#crumbs").addEventListener("click", e => {
  const b = e.target.closest("[data-root]"); if(!b) return;
  S.root = b.dataset.root; redraw();
});
$("#chainList").addEventListener("click", e => {
  const s = e.target.closest("[data-go]"); if(!s) return;
  S.focus = s.dataset.go; openSheet(s.dataset.go);
});
$("#chainTog").onclick = () => {
  const b = $("#chainList"); b.hidden = !b.hidden;
  $("#chainTog").textContent = b.hidden ? "عرض السلسلة" : "طيّ السلسلة";
};
$("#tGirls").onclick = () => { S.girls = !S.girls; try{localStorage.setItem("njrv.g", S.girls?"1":"0");}catch(e){} redraw(); };
$("#tZoomIn").onclick  = () => { S.sc = Math.min(1.8, S.sc + 0.12); try{localStorage.setItem("njrv.sc", S.sc);}catch(e){} redraw(); };
$("#tZoomOut").onclick = () => { S.sc = Math.max(0.68, S.sc - 0.12); try{localStorage.setItem("njrv.sc", S.sc);}catch(e){} redraw(); };
$("#tAll").onclick  = () => openAll(true);
$("#tNone").onclick = () => openAll(false);
$("#tSearch").addEventListener("input", e => {
  const q = e.target.value.trim();
  if(q.length < 2) return;
  const hit = Object.values(S.P).find(p => !p.gap && nameOf(p).includes(q));
  if(hit){ S.root = headId(); revealTo(hit.id); S.focus = hit.id; redraw();
    setTimeout(() => { const el = $(`.pcard[data-id="${CSS.escape(hit.id)}"]`); if(el) el.scrollIntoView({block:"center"}); }, 40); }
});

/* ═══════════ بطاقة الشخص ═══════════ */
function openSheet(id, quiet){
  const p = S.P[id]; if(!p) return;
  S.focus = id;
  const kids = kidsOf(id), sons = kids.filter(k => !isF(k) && !k.gap).length, dau = kids.filter(isF).length;
  const sib = p.parentId ? kidsOf(p.parentId) : [];
  const ix = sib.findIndex(x => x.id === id);
  const f = [];
  const stTxt = p.status === "alive" ? "على قيد الحياة" : (p.status === "dead" ? (isF(p) ? "رحمها الله" : "رحمه الله") : "غير معروفة");
  f.push(["الحالة", stTxt]);
  if(p.born)   f.push(["الميلاد", p.born + (p.bornCal === "g" ? " م" : (p.bornCal === "h" ? " هـ" : ""))]);
  if(p.died)   f.push(["الوفاة", p.died]);
  if(p.spouse) f.push([isF(p) ? "الزوج" : "الزوجة", p.spouse]);
  if(p.city)   f.push(["السكن", p.city]);
  if(p.parentId && S.P[p.parentId]) f.push([isF(p)?"بنت":"ابن", nameOf(S.P[p.parentId])]);
  if(sib.length > 1) f.push(["الترتيب", `${ar(ix+1)} من ${ar(sib.length)}` + (ix>0 ? ` · بعد ${nameOf(sib[ix-1])}` : " · الأكبر") + (ix<sib.length-1 ? ` · قبل ${nameOf(sib[ix+1])}` : " · الأصغر")]);
  if(sons) f.push(["الأبناء", ar(sons)]);
  if(dau)  f.push(["البنات", ar(dau)]);
  const d = descN(id); if(d) f.push(["في ذرّيته", ar(d)]);
  f.push(["الجيل من آدم عليه السلام", ar(lineOf(id).length)]);
  f.push(["المصدر", p._c === BASE ? "الأصل المحقّق بالمصادر" : "من شجرة العائلة"]);
  if(p.note) f.push(["ملاحظات", p.note]);

  const acts = [];
  if(p.parentId) acts.push(`<button class="b" data-act="up">↑ فرع ${esc(nameOf(S.P[p.parentId]))}</button>`);
  if(kidsVis(p.id).length) acts.push(`<button class="b" data-act="here">⌂ ابدأ الشجرة من هنا</button>`);

  $("#sheetBody").innerHTML =
    (p.photo ? `<img class="photo" src="/_blob/${esc(p.photo)}" alt="">` : "") +
    `<h2>${esc(nameOf(p))}</h2>
     <div class="nasab" id="nsb">${esc(S.fullNasab ? nasab(id) : nasabShort(id, 9))}</div>
     <button class="b sm" data-act="nsb" style="margin-bottom:8px">${S.fullNasab ? "اختصار النسب" : "عرض النسب كاملاً"}</button>
     <dl class="facts">${f.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
     <div class="row">${acts.join("")}</div>
     `;
  $("#sheet").classList.add("show");
}
$("#sheetX").onclick = () => $("#sheet").classList.remove("show");
$("#sheetBody").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, p = S.P[S.focus]; if(!p) return;
  if(a === "up"   && p.parentId){ S.root = p.parentId; S.open[p.parentId] = true; redraw(); }
  if(a === "here"){ S.root = p.id; S.open[p.id] = true; redraw(); }
  if(a === "nsb"){ S.fullNasab = !S.fullNasab; openSheet(p.id, true); }
});


$("#refsbody").innerHTML = REFS;
$("#tPrint").onclick = () => { openAll(true); setTimeout(() => print(), 160); };
go("home"); redraw();

</script></body></html>
