<title>رحلة نسب آل النجّار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* ── رحلةٌ صاعدة في النسب ──────────────────────────────────────────
   لا تُعرض الشجرة كلها دفعةً واحدة، بل يصعد الناظر فيها جيلاً بعد
   جيل. الاسم كبيرٌ دائماً، والسماء تتبدّل من ليل آدم إلى نهار اليوم. */
:root{
  --ink:#F3EADA; --gold:#E0B964; --gold2:#C09438; --rose:#E79CB8;
  --grey:#9E9684; --leaf:#7CAE68;
  --d:"Amiri","Traditional Arabic",serif;
  --u:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --sky1:#0B1020; --sky2:#141D33; --warm:0;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;max-width:100%}
body{direction:rtl;font-family:var(--u);color:var(--ink);background:#0B1020;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

#sky{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 62%,var(--sky2) 100%);
  transition:background 1.1s ease}
#stars,#sun,#dust{position:fixed;inset:0;pointer-events:none}
#sun{display:grid;place-items:center}
#sun i{display:block;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#FFE9B0,#F3C45E 55%,rgba(243,196,94,0) 72%);
  transform:translate(var(--sunx,-30vw),var(--suny,46vh)) scale(var(--suns,.6));opacity:var(--sunop,0);transition:1.1s ease}
#trunk{position:fixed;inset:0;pointer-events:none;opacity:.72}

/* ── مسرح الأسماء ── */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}
#rail{position:absolute;top:0;inset-inline:0;height:0;will-change:transform;transition:transform .62s cubic-bezier(.22,.9,.26,1)}
.gen{position:absolute;inset-inline:0;text-align:center;transition:opacity .5s,filter .5s;will-change:opacity}
.gen .no{font-family:var(--u);font-size:12px;letter-spacing:2px;color:var(--gold);opacity:.75}
.gen .nm{font-family:var(--d);font-weight:700;line-height:1.15;margin:4px 0 0;
  font-size:clamp(30px,8.4vw,62px);text-shadow:0 3px 24px rgba(0,0,0,.55)}
.gen .rel{font-size:13px;color:#D9CDB6;opacity:.82;margin-top:6px}
.gen .nt{display:inline-block;margin-top:9px;font-size:12.5px;line-height:1.7;max-width:min(560px,90vw);
  background:rgba(255,255,255,.10);border:1px solid rgba(224,185,100,.5);border-radius:999px;padding:5px 15px}
.gen.gap .nm{color:var(--grey);border-bottom:2px dashed var(--grey);display:inline-block;padding-bottom:4px}
.gen.mile .nm{color:var(--gold)}
.gen.near .nt,.gen.far .nt{display:none}
.gen.far{opacity:.16;filter:blur(1.4px)}
.gen.near{opacity:.5}

/* ── الأزرار ── */
.hud{position:fixed;inset-inline:0;z-index:20;display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 12px}
.hud.top{top:calc(10px + env(safe-area-inset-top,0px))}
.hud.bot{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.k{background:rgba(255,255,255,.10);border:1px solid rgba(224,185,100,.45);border-radius:999px;
  padding:8px 15px;font-size:13px;backdrop-filter:blur(7px);white-space:nowrap}
.k:hover{background:rgba(224,185,100,.22)}
.k.rnd{width:46px;height:46px;padding:0;font-size:20px;display:grid;place-items:center}
.k.on{background:var(--gold);color:#1A1407;border-color:var(--gold);font-weight:600}
.ttl{font-family:var(--d);font-size:clamp(15px,3.6vw,19px);font-weight:700;background:rgba(0,0,0,.26);
  border:1px solid rgba(224,185,100,.35);border-radius:999px;padding:5px 14px;backdrop-filter:blur(7px)}

/* ── شريط المحطات ── */
#rails{position:fixed;inset-inline-start:10px;top:50%;transform:translateY(-50%);z-index:20;
  display:flex;flex-direction:column;gap:0;align-items:center}
#rails .ln{width:2px;flex:1;background:linear-gradient(180deg,rgba(224,185,100,.1),rgba(224,185,100,.5))}
#rails button{position:relative;display:flex;align-items:center;gap:7px;padding:3px 0}
#rails .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);
  border:1px solid rgba(224,185,100,.6);flex:none;transition:.25s}
#rails button[aria-current="true"] .dot{background:var(--gold);transform:scale(1.45)}
#rails .lb{font-size:10.5px;color:#E6DCC6;opacity:0;transition:.2s;white-space:nowrap;
  background:rgba(0,0,0,.45);border-radius:999px;padding:1px 8px}
#rails button:hover .lb,#rails button[aria-current="true"] .lb{opacity:.95}
@media(max-width:520px){#rails .lb{display:none}}

/* ── شريط التقدّم ── */
#prog{position:fixed;inset-inline:0;top:0;height:3px;background:rgba(255,255,255,.1);z-index:25}
#prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width .6s}

/* ── البيت في الأعلى ── */
#house{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#F7F1E3,#EFE6D1);
  color:#241C12;overflow:auto;padding:14px 14px calc(26px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .7s cubic-bezier(.22,.9,.26,1)}
#house.show{transform:translateY(0)}
#house .wrap{max-width:860px;margin:0 auto}
#house h2{font-family:var(--d);font-size:clamp(23px,6vw,34px);margin:4px 0 2px;text-align:center}
#house .sub{text-align:center;font-size:13px;color:#8A7A60;margin-bottom:12px}
.kids{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 8px}
.pc{display:flex;gap:7px;align-items:center;background:#FFFCF3;border:1.5px solid #DCCDAA;
  border-radius:11px;padding:6px 12px;font-family:var(--d);font-size:17px;font-weight:700;
  max-width:100%;cursor:pointer}
.pc:hover{border-color:var(--gold2)}
.pc.f{border-color:#E7BECD;background:#FBEAF0}
.pc .c{font-family:var(--u);font-size:10.5px;background:#4E7A42;color:#fff;border-radius:999px;padding:0 6px;font-weight:600}
.pc.f .c{background:#B9587A}
.pc .d{width:7px;height:7px;border-radius:50%;flex:none}
.d1{background:#4E7A42}.d2{background:#A79F8C}.d0{background:#D9C58E}
.sub2{margin-inline-start:10px;padding-inline-start:10px;border-inline-start:2px dashed #DCCDAA;margin-top:5px}
.lbl{font-size:11.5px;color:#8A7A60;margin-bottom:3px}
#house .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
#house .k{background:#FFFCF3;border:1px solid #DCCDAA;color:#241C12;backdrop-filter:none}
#house .k.on{background:#B9587A;border-color:#B9587A;color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="sky"></div>
<canvas id="stars"></canvas>
<div id="sun"><i></i></div>
<div id="trunk"></div>
<div id="prog"><i></i></div>
<div id="stage"><div id="rail"></div></div>
<nav id="rails" aria-label="محطّات النسب"></nav>

<div class="hud top"><span class="ttl">رحلةُ نسبِ آلِ النجّار</span></div>
<div class="hud bot">
  <button class="k rnd" id="down" aria-label="إلى الوراء">▾</button>
  <button class="k" id="play">تشغيل الرحلة</button>
  <button class="k rnd" id="up" aria-label="إلى الأمام">▴</button>
  <button class="k" id="toTop">إلى البيت اليوم</button>
</div>

<div id="house"><div class="wrap">
  <div class="bar">
    <button class="k" id="hBack">▾ العودة إلى الرحلة</button>
    <button class="k" id="hGirls">إظهار البنات</button>
  </div>
  <h2 id="hTitle">بيتُ النجّار اليوم</h2>
  <div class="sub" id="hSub"></div>
  <div id="hTree"></div>
</div></div>
<script>
const D = {"chain":[{"n":"آدم عليه السلام","g":0},{"n":"شيث","g":0},{"n":"أنوش","g":0},{"n":"قينان","g":0},{"n":"مهلائيل","g":0},{"n":"يرد","g":0},{"n":"أخنوخ وهو إدريس «ع»","g":0},{"n":"متوشلخ","g":0},{"n":"لامك","g":0},{"n":"نوح «ع»","g":0},{"n":"سام","g":0},{"n":"أرفخشذ","g":0},{"n":"شالخ","g":0},{"n":"عابر","g":0},{"n":"فالغ","g":0},{"n":"أرغو","g":0},{"n":"ساروغ","g":0},{"n":"ناحور","g":0},{"n":"تارح وهو آزر","g":0},{"n":"إبراهيم «ع»","g":0},{"n":"إسماعيل «ع»","g":0},{"n":"قيدار","g":0},{"n":"نبت","g":0},{"n":"تيمن","g":0},{"n":"الهميسع","g":0},{"n":"قحطان","g":0},{"n":"يعرب","g":0},{"n":"يشجب","g":0},{"n":"سبأ","g":0},{"n":"كهلان","g":0},{"n":"زيد","g":0},{"n":"مالك","g":0},{"n":"نبت","g":0},{"n":"الغوث","g":0},{"n":"الأزد","g":0},{"n":"مازن","g":0},{"n":"ثعلبة","g":0},{"n":"امرئ القيس (الشاعر)","g":0},{"n":"حارثة الغطريف","g":0},{"n":"عامر ماء السماء","g":0},{"n":"عمرو","g":0},{"n":"ثعلبة","g":0},{"n":"حارثة","g":0},{"n":"الخزرج الأكبر","g":0},{"n":"عمرو","g":0},{"n":"ثعلبة","g":0},{"n":"النجار واسمه تيم الله","g":0},{"n":"مالك","g":0},{"n":"غنم","g":0},{"n":"عبد عوف","g":0},{"n":"ثعلبة","g":0},{"n":"كليب","g":0},{"n":"زيد","g":0},{"n":"أبو أيوب الأنصاري — خالد","g":0},{"n":"أبي منصور","g":0},{"n":"الأشعب الاول","g":0},{"n":"شبرحيل","g":0},{"n":"مقوم","g":0},{"n":"الجنيد","g":0},{"n":"ثعلبة","g":0},{"n":"مت الثاني","g":0},{"n":"إبراهيم الأشعث","g":0},{"n":"سالم","g":0},{"n":"حسان","g":0},{"n":"زيد","g":0},{"n":"كثير","g":0},{"n":"عمر","g":0},{"n":"عبدالرحمن","g":0},{"n":"يوسف","g":0},{"n":"إبراهيم","g":0},{"n":"محمد","g":0},{"n":"فخر الدين","g":0},{"n":"أبو الوليد محمد","g":0},{"n":"رمضان اخلاص","g":0},{"n":"أبي بكر","g":0},{"n":"تقي الدين","g":0},{"n":"يوسف","g":0},{"n":"جمال الدين","g":0},{"n":"شهاب أحمد","g":0},{"n":"ولي الدين محمد","g":0},{"n":"شهاب الدين محمد","g":0},{"n":"قاضي جمال الدين","g":0},{"n":"إبراهيم","g":0},{"n":"أحمد","g":0},{"n":"نجيب","g":0},{"n":"سعيد","g":0},{"n":"عطا الله","g":0},{"n":"","g":1},{"n":"عبدالقادر","g":0},{"n":"الشيخ محمد ال   "آدم عليه السلام":"أبو البشر عليه السلام — ومن هنا تبدأ السلسلة",
  "أخنوخ وهو إدريس «ع»":"إدريس عليه السلام — أوّل من خطّ بالقلم",

  const t = (p - s[0]) / Math.max(1e-6, e[0] - s[0]);
  const r = document.documentElement.style;
  r.setProperty("--sky1", mix(s[1], e[1], t));
  r.setProperty("--sky2", mix(s[2], e[2], t));
  r.setProperty("--sunop", p < 0.5 ? 0 : Math.min(1, (p - 0.5) / 0.3));
  r.setProperty("--suny", (46 - p * 62) + "vh");
  r.setProperty("--suns", (0.6 + p * 0.7));
  document.getElementById("stars").style.opacity = String(Math.max(0, 1 - p * 1.8));
}

/* ── نجوم ── */
(function stars(){
  const c = document.getElementById("stars"), x = c.getContext("2d");
  function paint(){
    c.width = innerWidth; c.height = innerHeight;
    x.clearRect(0,0,c.width,c.height);
    let s = 9;
    const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
    for(let i = 0; i < 160; i++){
      const r = rnd() * 1.5 + 0.3;
      x.globalAlpha = 0.25 + rnd() * 0.7;
      x.beginPath(); x.arc(rnd() * c.width, rnd() * c.height * 0.92, r, 0, 7); x.fillStyle = "#FFF6DF"; x.fill();
    }
  }
  paint(); addEventListener("resize", paint);
})();

/* ── جذع النخلة خلف الأسماء ── */
document.getElementById("trunk").innerHTML =
  `<svg width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="bk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241607"/><stop offset=".38" stop-color="#7A5329"/>
      <stop offset="1" stop-color="#241607"/></linearGradient></defs>
    <path d="M176 800 C 180 560 182 300 184 0 L 216 0 C 218 300 220 560 224 800 Z" fill="url(#bk)" opacity=".8"/>
    <g stroke="#181006" stroke-width="2" opacity=".3" id="rings"></g></svg>`;
(function rings(){
  const g = document.querySelector("#rings"); let s = "";
  for(let y = -20; y < 820; y += 26) s += `<path d="M178 ${y} q 22 7 44 0"/>`;
  g.innerHTML = s;
})();

/* ── الحركة ── */
function render(){
  const H = innerHeight;
  rail.style.transform = `translateY(${H * 0.46 + idx * STEP}px)`;
  [...rail.children].forEach((el, i) => {
    const d = Math.abs(i - idx);
    el.className = "gen" + (C[i].g ? " gap" : "") + (MILE.includes(C[i].n) ? " mile" : "")
                 + (d === 0 ? "" : d === 1 ? " near" : " far");
    el.style.pointerEvents = d === 0 ? "auto" : "none";
  });
  const p = idx / (N - 1);
  sky(p);
  document.querySelector("#prog i").style.width = (p * 100) + "%";
  let cur = mileIdx[0];
  mileIdx.forEach(j => { if(j <= idx) cur = j; });
  document.querySelectorAll("#rails button").forEach(b =>
    b.setAttribute("aria-current", String(+b.dataset.j === cur)));
  document.getElementById("toTop").textContent = idx >= N - 1 ? "ادخل البيت" : "إلى البيت اليوم";
}
function move(d){ goTo(idx + d); }
function goTo(i){
  const was = idx;
  idx = Math.max(0, Math.min(N - 1, i));
  render();
  if(was === N - 1 && idx === N - 1) openHouse();
}
document.getElementById("up").onclick = () => { stop(); move(1); };
document.getElementById("down").onclick = () => { stop(); move(-1); };
document.getElementById("toTop").onclick = () => { stop(); if(idx >= N - 1) openHouse(); else goTo(N - 1); };
document.getElementById("rails").addEventListener("click", e => {
  const b = e.target.closest("button"); if(b){ stop(); goTo(+b.dataset.j); } });
addEventListener("keydown", e => {
  if(e.key === "ArrowUp" || e.key === "ArrowRight"){ stop(); move(1); e.preventDefault(); }
  if(e.key === "ArrowDown" || e.key === "ArrowLeft"){ stop(); move(-1); e.preventDefault(); }
  if(e.key === "Home"){ stop(); goTo(0); } if(e.key === "End"){ stop(); goTo(N-1); }
});
let acc = 0, lock = 0;
addEventListener("wheel", e => {
  if(document.getElementById("house").classList.contains("show")) return;
  e.preventDefault(); acc += e.deltaY;
  const now = Date.now(); if(now < lock) return;
  if(Math.abs(acc) > 40){ stop(); move(acc > 0 ? 1 : -1); acc = 0; lock = now + 230; }
}, { passive:false });
let ty = null;
const stage = document.getElementById("stage");
stage.addEventListener("pointerdown", e => { ty = e.clientY; });
stage.addEventListener("pointerup", e => {
  if(ty === null) return; const dy = ty - e.clientY; ty = null;
  if(Math.abs(dy) > 26){ stop(); move(dy > 0 ? 1 : -1); }
});
function stop(){ playing = false; clearInterval(timer); document.getElementById("play").classList.remove("on");
  document.getElementById("play").textContent = "تشغيل الرحلة"; }
document.getElementById("play").onclick = function(){
  if(playing){ stop(); return; }
  playing = true; this.classList.add("on"); this.textContent = "إيقاف";
  if(idx >= N - 1) goTo(0);
  timer = setInterval(() => {
    if(idx >= N - 1){ stop(); openHouse(); return; }
    const slow = MILE.includes(C[idx].n);
    move(1);
    if(slow){ clearInterval(timer); setTimeout(() => { if(playing) timer = setInterval(() => {
      if(idx >= N - 1){ stop(); openHouse(); return; } move(1); }, 900); }, 1700); }
  }, 900);
};

/* ── البيت ── */
let girls = false;
const vis = x => girls || !x.f || x.g;
function kidsOf(x){ return (x.k || []).filter(vis); }
function count(x){ let n = 0; (x.k || []).forEach(k => { n += 1 + count(k); }); return n; }
let openSet = new Set();
function pc(x, path){
  const kv = kidsOf(x).length, hid = (x.k || []).length - kv;
  return `<button class="pc ${x.f?"f":""}" data-p="${path}">
    <span class="d d${x.s}"></span><span>${esc(nm(x))}</span>
    ${kv?`<span class="c">${ar(kv)}</span>`:""}
    ${hid?`<span class="c" style="background:#A79F8C">+${ar(hid)}</span>`:""}
    ${kv?`<span style="font-family:var(--u);font-size:11px;color:#8A7A60">${openSet.has(path)?"▴":"▾"}</span>`:""}
  </button>`;
}
function level(x, path){
  const ks = kidsOf(x); if(!ks.length) return "";
  let h = `<div class="kids">` + ks.map((k, i) => pc(k, path + "." + i)).join("") + `</div>`;
  ks.forEach((k, i) => { const p2 = path + "." + i;
    if(openSet.has(p2) && kidsOf(k).length)
      h += `<div class="sub2"><div class="lbl">أبناء ${esc(nm(k))}</div>${level(k, p2)}</div>`; });
  return h;
}
function drawHouse(){
  const F = D.fam;
  document.getElementById("hTitle").textContent = nm(F);
  const tot = (function c(x){ let n = 1; (x.k||[]).forEach(k => n += c(k)); return n; })(F);
  document.getElementById("hSub").textContent = "وذرّيّتُه — " + ar(tot - 1) + " اسماً · الجيل " + ar(N) + " فما بعده";
  document.getElementById("hTree").innerHTML =
    `<div class="kids">${pc(F, "0")}</div><div class="sub2"><div class="lbl">أبناء ${esc(nm(F))}</div>${level(F, "0")}</div>`;
  const g = document.getElementById("hGirls");
  g.textContent = girls ? "إخفاء البنات" : "إظهار البنات"; g.classList.toggle("on", girls);
}
document.getElementById("hTree").addEventListener("click", e => {
  const b = e.target.closest(".pc"); if(!b) return;
  const p = b.dataset.p;
  if(openSet.has(p)) openSet.delete(p); else openSet.add(p);
  drawHouse();
});
document.getElementById("hGirls").onclick = () => { girls = !girls; drawHouse(); };
document.getElementById("hBack").onclick = () => document.getElementById("house").classList.remove("show");
function openHouse(){ drawHouse(); document.getElementById("house").classList.add("show"); }

addEventListener("resize", render);
render();
</script>
